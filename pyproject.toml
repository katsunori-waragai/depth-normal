[project]
name = "depth-normal"
version = "0.1.0"
description = "Estimate depth from single images and generate normal maps with pseudo-shading"
readme = "README.md"
authors = [
    { name = "katsunori-waragai", email = "huyuhiko1128@gmail.com" }
]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "Pillow",
    "opencv-python",
    "torch",
    "torchvision",
    "transformers",
]

[dependency-groups]
dev = ["pytest"]

[uv]
python-version = "3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
