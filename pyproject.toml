[project]
name = "depth-normal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "katsunori-waragai", email = "huyuhiko1128@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "Pillow",
    "opencv-python",
    "torch",
    "torchvision",
    "transformers",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
depth-normal = "depth_normal:main"

[uv]
python-version = "3.9"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
